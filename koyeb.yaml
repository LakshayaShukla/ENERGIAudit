name: energiaudit-backend
services:
  - name: api
    type: git
    git:
      repository: github.com/LakshayaShukla/ENERGIAudit
      branch: main
      workdir: backend
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    instance_type: nano
    env:
      - key: DATABASE_URL
        value: sqlite:///./energiaudit.db
      - key: SECRET_KEY
        value: energiaudit-change-me-in-production
